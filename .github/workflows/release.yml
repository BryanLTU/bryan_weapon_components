name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      RESOURCE_NAME: bryan_weapon_components
    steps:
      - uses: actions/checkout@v7

      - name: Update fxmanifest version
        run: |
          sed -i "s/^version .*/version '${VERSION#v}'/" fxmanifest.lua
          grep "^version " fxmanifest.lua

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package resource
        run: |
          mkdir -p "release/$RESOURCE_NAME/web"
          cp -r fxmanifest.lua config.lua client server LICENSE README.md "release/$RESOURCE_NAME/"
          cp -r web/dist "release/$RESOURCE_NAME/web/dist"
          cd release && zip -r "../$RESOURCE_NAME.zip" "$RESOURCE_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "$RESOURCE_NAME.zip" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag

      - name: Commit fxmanifest version to default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -f -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          sed -i "s/^version .*/version '${VERSION#v}'/" fxmanifest.lua
          git add fxmanifest.lua
          if git diff --cached --quiet; then
            echo "fxmanifest already at ${VERSION#v}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: Bump version to $VERSION"
          git push origin "$DEFAULT_BRANCH"
